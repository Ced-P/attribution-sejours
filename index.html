<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attribution des séjours</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,520;9..144,620&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1E8; --card:#FFFFFF; --ink:#23201A; --muted:#6E675C; --line:#DED8CA; --line2:#EFECE2;
  --teal:#16443D; --teal-deep:#0C2C27; --gold:#BE9E55; --gold-soft:#F3EAD3;
  --ok:#1E7A5A; --ok-bg:#E6F2EC; --warn:#9A6512; --warn-bg:#FBF0DC;
  --bad:#B3364B; --bad-bg:#F9E7EB; --force:#6D4FA3; --force-bg:#EFE9F8;
  --info:#2C5E8A; --info-bg:#E8F0F7; --vac:#EAF1EE;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:'Source Sans 3',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(135deg,var(--teal-deep),var(--teal));color:#F2EFE6}
header .wrap{padding-top:24px;padding-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{color:var(--gold);font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
header h1{font-family:'Fraunces',Georgia,serif;font-weight:520;font-size:1.9rem;line-height:1.15}
header .sub{color:#BFD2CB;font-size:.85rem;margin-top:5px}
.h-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-weight:600;font-size:.85rem;transition:background .15s,color .15s,border-color .15s}
.btn-gold{background:var(--gold);color:var(--teal-deep)} .btn-gold:hover{background:#D3B569}
.btn-ghost{border:1.5px solid rgba(242,239,230,.4);color:#F2EFE6} .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-teal{background:var(--teal);color:#fff} .btn-teal:hover{background:var(--teal-deep)}
.btn-line{border:1.5px solid var(--line);background:var(--card);color:var(--ink)} .btn-line:hover{border-color:var(--teal)}
.btn-force{background:var(--force);color:#fff} .btn-force:hover{background:#5A3F8C}
.btn-danger{border:1.5px solid #E4C3CB;background:var(--card);color:var(--bad)} .btn-danger:hover{background:var(--bad-bg)}
.btn-sm{padding:5px 10px;font-size:.78rem;border-radius:7px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

#bandeau{background:var(--card);border-bottom:1px solid var(--line)}
#bandeau .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap;font-size:.85rem}
.badge{font-size:.66rem;font-weight:700;letter-spacing:.12em;padding:4px 9px;border-radius:6px}
.badge-int{background:var(--gold-soft);color:#7A6330}
.badge-fic{background:var(--ok-bg);color:var(--ok)}
#bandeau .src{flex:1;min-width:200px;color:var(--muted)}
#bandeau .src b{color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.84rem;cursor:pointer;user-select:none}
.toggle .sw{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex-shrink:0}
.toggle .sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on .sw{background:var(--ok)} .toggle.on .sw::after{left:19px}

nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;box-shadow:0 1px 4px rgba(35,32,26,.05)}
nav .wrap{display:flex;overflow-x:auto;gap:2px}
.tab{padding:12px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;font-size:.86rem;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--teal);border-bottom-color:var(--gold)}
.tab .k{background:var(--gold-soft);color:#7A6330;border-radius:99px;padding:0 7px;font-size:.7rem;font-weight:700}
.tab .k.alerte{background:var(--warn-bg);color:var(--warn)}

main{padding:26px 0 50px}
h2{font-family:'Fraunces',Georgia,serif;font-weight:520;font-size:1.6rem;margin-bottom:4px}
.lead{color:var(--muted);max-width:780px;margin-bottom:20px}
h3{font-family:'Fraunces',Georgia,serif;font-weight:520;font-size:1.18rem;margin:24px 0 10px}
h4{font-size:.95rem;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.note{background:var(--info-bg);border:1px solid #C9DBEA;color:#1F4460;border-radius:10px;padding:11px 14px;font-size:.87rem;margin:12px 0}
.note-warn{background:var(--warn-bg);border-color:#E8D2A8;color:#6B4A10}
.note-force{background:var(--force-bg);border-color:#D6C9EC;color:#4A356F}
.note-ok{background:var(--ok-bg);border-color:#BCDCCB;color:#174F3B}
.muted{color:var(--muted)} .small{font-size:.8rem} .mini{font-size:.74rem;color:var(--muted)}
p+p{margin-top:8px}
ul.plain{list-style:none} ul.puces{padding-left:18px} ul.puces li{margin-bottom:4px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .v{font-family:'Fraunces',Georgia,serif;font-size:2rem;line-height:1}
.stat .l{font-size:.8rem;color:var(--muted);margin-top:4px}

.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#FBFAF6;margin-bottom:8px;font-size:.88rem}
.todo .ic{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700}
.todo.ok .ic{background:var(--ok);color:#fff} .todo.w .ic{background:var(--warn);color:#fff}
.todo button.lien{color:var(--info);font-weight:600;text-decoration:underline;text-underline-offset:2px}

.regle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#FBFAF6;margin-bottom:8px}
.regle label{font-size:.88rem;font-weight:600}
.regle small{display:block;color:var(--muted);font-size:.76rem;font-weight:400}
.regle input[type=number]{width:62px;text-align:center;font-weight:700;padding:5px;border:1px solid var(--line);border-radius:7px;background:#fff}
.regle select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:.84rem}
.crit{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#FBFAF6}
.crit .rang{width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.crit .lib{flex:1;font-size:.87rem;font-weight:600}
.crit .lib small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.crit .fl{display:flex;flex-direction:column}
.crit .fl button{color:var(--muted);line-height:.95;font-size:.8rem;padding:1px 5px}
.crit .fl button:hover{color:var(--ink)}
.bareme{width:100%;border-collapse:collapse;font-size:.85rem}
.bareme td{padding:6px 8px;border-top:1px solid var(--line2)}
.bareme td:last-child{text-align:right;font-weight:700}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:.84rem}
.chip{padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:.78rem;font-weight:600;color:var(--muted)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}
table.t thead th{position:sticky;top:0;background:#EFEBDF;color:#57503F;text-align:left;padding:8px 10px;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;z-index:2}
table.t tbody td{padding:7px 10px;border-top:1px solid var(--line2);vertical-align:top}
table.t tbody tr.clic{cursor:pointer} table.t tbody tr.clic:hover{background:#FAF8F1}
table.t tbody tr.sel{background:#F3EFE2}
td.r,th.r{text-align:right}
.nowrap{white-space:nowrap}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;border-radius:7px;font-weight:700;padding:0 6px;font-size:.84rem}
.s-neg{background:var(--force-bg);color:var(--force)} .s-0{background:var(--ok-bg);color:var(--ok)} .s-1{background:#E3EFEA;color:#1C5A4B}
.s-2{background:var(--warn-bg);color:var(--warn)} .s-3{background:var(--bad-bg);color:var(--bad)}
.tag{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:6px;margin:1px 3px 1px 0;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-info{background:var(--info-bg);color:var(--info)} .t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)} .t-force{background:var(--force-bg);color:var(--force)} .t-gold{background:var(--gold-soft);color:#7A6330}
.t-gris{background:#EFECE2;color:var(--muted)}
.ch{display:block;font-size:.8rem;line-height:1.35;margin-bottom:2px}
.ch b{display:inline-block;width:16px;color:var(--muted)}
.ch.gagne{color:var(--ok);font-weight:700}
.ch.barre{color:#A59E90;text-decoration:line-through}
.prix{font-variant-numeric:tabular-nums;white-space:nowrap}
.prix.propose{color:var(--warn)}

.detail{background:#FBFAF6;border-top:1px solid var(--line);padding:14px 16px}
.detail .grid2{gap:20px}
.detail table.t thead th{position:static;background:#F2EEE3}
.ligne-ref{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.85rem}
.form-inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.form-inline input[type=text],.form-inline input[type=date],.form-inline select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:.84rem}
.form-inline input[type=text]{min-width:140px}

.att{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden}
.att.f{border:2px solid #C9B7E8} .att.r{border:2px solid #E8D2A8} .att.ann{opacity:.6}
.att-head{display:flex;align-items:stretch;width:100%;text-align:left}
.att-head:hover{background:#FAF8F1}
.att-date{padding:10px 14px;min-width:160px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.att-date .d{font-family:'Fraunces',Georgia,serif;font-size:.98rem}
.att-date small{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.att-main{flex:1;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.att-main .who{font-weight:700}
.att-main .how{font-size:.8rem;color:var(--muted)}
.att-side{display:flex;align-items:center;gap:10px}
.chev{color:var(--muted);transition:transform .15s;padding:0 12px;display:flex;align-items:center}
.open .chev{transform:rotate(180deg)}
.cand{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;background:#fff;border:1px solid var(--line2);margin-bottom:5px;font-size:.85rem;flex-wrap:wrap}
.cand .q{flex:1;min-width:180px}
.dec-box{margin-top:12px;border:1.5px solid #D6C9EC;background:var(--force-bg);border-radius:10px;padding:12px}
.dec-box h5{font-size:.84rem;color:#4A356F;margin-bottom:6px}
@media(max-width:700px){.att-head{flex-direction:column}.att-date{border-right:none;border-bottom:1px solid var(--line)}}

.cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.cal-mois{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.cal-mois h4{font-family:'Fraunces',Georgia,serif;font-weight:520;font-size:1rem;margin:0 0 8px;color:var(--teal-deep)}
.cal-tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.cal-tbl th{font-size:.58rem;color:var(--muted);padding:2px 0;text-transform:uppercase;text-align:center;font-weight:600}
.cal-tbl td{height:30px;text-align:center;font-size:.68rem;border:1px solid #F0EBDD;padding:0;position:relative}
.cal-tbl td.hm{background:transparent;border-color:transparent}
.cal-tbl td.vac{background:var(--vac)}
.cal-tbl td.occ{color:#fff;font-weight:700;border-color:rgba(255,255,255,.4)}
.cal-tbl td.fer::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--bad)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin:6px 0 14px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.dotc{width:11px;height:11px;border-radius:3px;display:inline-block}

.fiche{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:26px 30px;box-shadow:0 2px 10px rgba(35,32,26,.06);position:relative}
.fiche::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--teal),var(--gold))}
.fiche .en-tete{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.fiche .en-tete .t{font-family:'Fraunces',Georgia,serif;font-size:1.3rem}
.j-dem{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;font-size:.88rem}
.j-dem.gagne{border-color:#BCDCCB;background:#F5FAF7}
.j-dem.perdu{border-color:#EBC9D1;background:#FDF7F8}
.j-dem.neutre{background:#FAF9F4}
.j-dem .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:3px;font-weight:700}
textarea.lettre{width:100%;min-height:340px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#FBFAF4;font:inherit;font-size:.86rem;resize:vertical;line-height:1.5}
textarea.modele{width:100%;min-height:200px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#FBFAF4;font-family:ui-monospace,Menlo,monospace;font-size:.78rem;resize:vertical}
.vars{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px}
.vars code{font-size:.72rem;background:#EFECE2;padding:2px 6px;border-radius:5px}
.liste-f{max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.liste-f button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:8px 12px;border-top:1px solid var(--line2);font-size:.86rem;gap:8px}
.liste-f button:first-child{border-top:none}
.liste-f button:hover{background:#FAF8F1}
.liste-f button.on{background:#F0F4F0;font-weight:700}
.split{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media(max-width:900px){.split{grid-template-columns:1fr}}

.gap{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px}
.gap.lib{border-color:#E8D2A8;background:#FFFCF4}
.gap .h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gap .h .d{font-family:'Fraunces',Georgia,serif;font-size:1rem}

footer{border-top:1px solid var(--line);background:var(--card);padding:14px 0;text-align:center;color:var(--muted);font-size:.76rem}
.hide{display:none!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--teal-deep);color:#fff;padding:10px 18px;border-radius:10px;font-size:.88rem;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media print{header,nav,#bandeau,footer,.no-print{display:none!important}main{padding:0}.fiche{box-shadow:none;border:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div>
      <div class="eyebrow" id="h-eyebrow"></div>
      <h1 id="h-titre">Attribution des séjours</h1>
      <div class="sub" id="h-sub"></div>
    </div>
    <div class="h-actions">
      <button class="btn btn-gold" data-act="importer">⭱ Importer un fichier</button>
      <button class="btn btn-ghost" data-act="exporter">⭳ Exporter le classeur</button>
      <button class="btn btn-ghost" data-act="reset">↺ Réinitialiser</button>
    </div>
  </div>
</header>
<div id="bandeau"><div class="wrap"></div></div>
<nav><div class="wrap" id="nav-tabs"></div></nav>
<main><div class="wrap" id="vue"></div></main>
<footer><div class="wrap">Outil libre d'attribution des séjours (licence MIT). Les réglages et décisions sont enregistrés dans ce navigateur ; le classeur exporté les conserve pour l'année suivante.</div></footer>
<input type="file" id="file-input" accept=".xlsx,.xls,.ods" class="hide">
<div id="toast"></div>
<script>
/* ═══════════════ CONFIGURATION : à adapter à votre association ═══════════════
   Tout ce qui est propre à votre association se règle dans cet objet.
   Le reste du fichier n'a pas besoin d'être modifié. */
const CONFIG = {
  association: 'Association Exemple',               // nom affiché en haut de la page
  lieu: 'la maison commune',                        // le lieu partagé, tel qu'on l'écrit après « un séjour à »
  annee: 2027,                                      // année de la campagne d'attribution
  signature: 'Le comité des séjours',               // signature des courriers
  reglesVotees: 'les règles votées en conseil d\'administration',  // rappelées en tête de la synthèse
  dateReponse: '2027-01-31',                        // date limite de réponse proposée dans les courriers
  nuitsMax: 10,                                     // au-delà, une demande n'est pas examinée
  libelleOption: 'Option',                          // question libre du formulaire (ex. « Bateau », « Linge fourni »)
  contactTroisiemeTour: '',                         // adresse de contact du 3e tour ; laisser vide pour ne rien afficher

  // Grille tarifaire en euros. « chaude » = saison haute (mois saisonHaute[0] à saisonHaute[1]), « froide » = le reste.
  // sem_vac : semaine en vacances scolaires · sem_hors : semaine hors vacances · we : week-end (2 nuits, arrivée le vendredi)
  // mw : « middle week » (4 nuits, arrivée le lundi). Les autres durées sont proposées au prorata, signalées par *.
  saisonHaute: [5, 10],
  grille: {chaude:{sem_vac:1800, sem_hors:1300, we:550, mw:800}, froide:{sem_vac:1100, sem_hors:700, we:380, mw:420}},

  // Vacances scolaires, union des zones A, B et C (premier jour de vacances → dernier jour avant la reprise).
  // La liste doit couvrir les trois années qui précèdent la campagne et l'année de la campagne.
  vacances: [
    ['2023-10-21','2023-11-05'],['2023-12-23','2024-01-07'],['2024-02-10','2024-03-10'],['2024-04-06','2024-05-05'],['2024-07-06','2024-09-01'],
    ['2024-10-19','2024-11-03'],['2024-12-21','2025-01-05'],['2025-02-08','2025-03-09'],['2025-04-05','2025-05-04'],['2025-07-05','2025-08-31'],
    ['2025-10-18','2025-11-02'],['2025-12-20','2026-01-04'],['2026-02-07','2026-03-08'],['2026-04-04','2026-05-03'],['2026-07-04','2026-08-31'],
    ['2026-10-17','2026-11-01'],['2026-12-19','2027-01-03'],['2027-02-06','2027-03-07'],['2027-04-03','2027-05-02'],['2027-07-03','2027-09-01'],
    ['2027-10-23','2027-11-07'],['2027-12-18','2028-01-02'],

/* ═══════════════ MOTEUR (calculs purs, sans affichage) ═══════════════ */
const ENGINE = (() => {
  const N = CONFIG.annee;
  const VAC = CONFIG.vacances;
  const NOM_VAC = CONFIG.nomsVacances;
  const FER = new Set(CONFIG.feries);
  const GRILLE = CONFIG.grille;
  const LIB_FORMULE = {sem_vac:'semaine en vacances', sem_hors:'semaine hors vacances', we:'week-end', mw:'middle week'};
  const NOTES = {aucun:0, horsVacN2N3:1, vacN2N3:2, horsVacN1:3, vacN1:4};
  const LIB_CAT = {aucun:`aucun séjour depuis ${N-3}`, horsVacN2N3:`séjour hors vacances en ${N-3} ou ${N-2}`, vacN2N3:`séjour en vacances en ${N-3} ou ${N-2}`, horsVacN1:`séjour hors vacances en ${N-1}`, vacN1:`séjour en vacances en ${N-1}`};
  const STOP = new Set(['NEE','ET','DE','DU','LA','LE','DES','EP','DEMANDE','FORMULEE','PAR']);
  const CRITERES = {
    semaine:   {lib:'semaine complète', val:(x,f)=> x.semaine?0:1},
    premier:   {lib:'premier séjour', val:(x,f)=> f.nb===0?0:1},
    anciennete:{lib:'ancienneté du dernier séjour', val:(x,f)=> f.an||0},
    service:   {lib:'service rendu', val:(x,f)=> f.service?0:1},
  };

  // ── Dates (UTC, ISO aaaa-mm-jj) ──
  const D = iso => Date.UTC(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10));
  const ISO = t => new Date(t).toISOString().slice(0,10);
  const plus = (iso,n) => ISO(D(iso)+n*864e5);
  const nuits = (d,f) => Math.round((D(f)-D(d))/864e5);
  const jsem = iso => (new Date(D(iso)).getUTCDay()+6)%7;   // lundi = 0 … dimanche = 6
  const invac = iso => VAC.some(([a,b]) => a<=iso && iso<=b);
  function nuitsVac(d,f){ const n=nuits(d,f); let v=0; for(let i=0;i<n;i++) if(invac(plus(d,i))) v++; return [v,n]; }
  function estVacSejour(d,f){ if(!d) return false; if(!f||f<=d) return invac(d); const [v,n]=nuitsVac(d,f); return v*2>n; }
  const chevauche = (a,b) => a.debut < b.fin && b.debut < a.fin;
  const periodeVac = iso => { const p=VAC.find(([a,b])=>a<=iso&&iso<=b); return p?(NOM_VAC[p[0]]||'vacances'):null; };

  // ── Noms : même normalisation que le script de contrôle ──
  function normTokens(s){
    s = String(s ?? '').normalize('NFD').replace(/[^\x00-\x7F]/g,'').toUpperCase().replace(/[^A-Z]/g,' ');
    return s.split(/\s+/).filter(t => t && !STOP.has(t));
  }
  function cle(nom, prenom){
    const ns=normTokens(nom), ps=normTokens(prenom).slice(0,2), out=[], vu=new Set();
    for(const a of ns) for(const b of ps){ const k=a+'|'+b; if(!vu.has(k)){vu.add(k); out.push([a,b]);} }
    return out;
  }
  // Ratcliff-Obershelp, comme difflib.SequenceMatcher.ratio() (sans heuristique « junk », inutile sur des noms)
  function ratio(a,b){
    function longest(alo,ahi,blo,bhi){
      let bi=alo,bj=blo,bk=0; let j2len=new Map();
      for(let i=alo;i<ahi;i++){ const nj=new Map();
        for(let j=blo;j<bhi;j++){ if(a[i]!==b[j]) continue; const k=(j2len.get(j-1)||0)+1; nj.set(j,k); if(k>bk){bi=i-k+1;bj=j-k+1;bk=k;} }
        j2len=nj; }
      return [bi,bj,bk];
    }
    let m=0; const pile=[[0,a.length,0,b.length]];
    while(pile.length){ const [alo,ahi,blo,bhi]=pile.pop(); const [i,j,k]=longest(alo,ahi,blo,bhi);
      if(k){ m+=k; if(alo<i&&blo<j) pile.push([alo,i,blo,j]); if(i+k<ahi&&j+k<bhi) pile.push([i+k,ahi,j+k,bhi]); } }
    const t=a.length+b.length; return t?2*m/t:1;
  }
  function proche(c1,c2){
    for(const [a1,b1] of c1) for(const [a2,b2] of c2)
      if(b1===b2 && (a1===a2 || (a1.length>4 && ratio(a1,a2)>=0.88))) return true;
    return false;
  }
  const cleFoyer = (nom,prenom) => normTokens(nom).join(' ')+' | '+normTokens(prenom).join(' ');

  // ── Tarifs ──
  function classer(d,f){
    const n=nuits(d,f), m=+d.slice(5,7), saison=(m>=CONFIG.saisonHaute[0]&&m<=CONFIG.saisonHaute[1])?'chaude':'froide';
    const [nv]=nuitsVac(d,f); const fer=[]; for(let i=0;i<=n;i++){ const j=plus(d,i); if(FER.has(j)) fer.push(j); }
    if(n===7){
      if(nv*2>n) return {saison, formule:'sem_vac'};
      if(nv) return {saison, hg:'semaine à cheval sur les vacances'};
      if(fer.length) return {saison, hg:'semaine hors vacances avec férié', fer};
      return {saison, formule:'sem_hors'};
    }
    if(n===2 && jsem(d)===4) return {saison, formule:'we'};
    if(n===4 && jsem(d)===0){ if(nv||fer.length) return {saison, hg:'middle week en vacances ou avec férié', fer, nv}; return {saison, formule:'mw'}; }
    return {saison, hg:n+' nuits, durée libre', nv, n};
  }
  // Règles proposées pour les demandes hors grille (à valider)
  function prixPropose(d,f,c){
    const g=GRILLE[c.saison], n=nuits(d,f), [nv]=nuitsVac(d,f);
    if(c.hg==='semaine à cheval sur les vacances') return {prix:g.sem_vac, regle:'tarif semaine de vacances (début ou fin de vacances, ponts de mai)'};
    if(c.hg==='semaine hors vacances avec férié'){ const semaine=c.fer.some(j=>jsem(j)<5);
      return semaine?{prix:g.sem_vac, regle:'férié en semaine : tarif semaine de vacances'}:{prix:g.sem_hors, regle:'férié le week-end : tarif semaine hors vacances'}; }
    if(c.hg && c.hg.startsWith('middle week')) return {prix:Math.round(g.sem_vac/7*4), regle:'prorata du tarif semaine de vacances (4 nuits)'};
    const base = nv*2>n ? g.sem_vac : g.sem_hors;
    return {prix:Math.round(base/7*n), regle:`prorata du tarif semaine ${nv*2>n?'de vacances':'hors vacances'} (${n} nuits)`};
  }
  function tarif(d,f){
    const c=classer(d,f), n=nuits(d,f), ok=d.slice(0,4)===String(N) && n>0 && n<=CONFIG.nuitsMax;
    if(c.formule) return {...c, prix: ok?GRILLE[c.saison][c.formule]:null, propose:null};
    return {...c, prix:null, propose: ok?prixPropose(d,f,c):null};
  }

  // ── Historique, refus, rapprochement ──
  function preparer(data){
    const sejours = data.hist.map(([an,d,f,nom,prenom,ref,br]) => ({an, debut:d, fin:f, nom, prenom, ref, branche:br, cles:cle(nom,prenom), vac:estVacSejour(d,f)}));

  // mode 'cumul' : chaque séjour des trois dernières années rapporte ses points, −1 par refus survenu au moins 4 ans après le dernier séjour
  // mode 'dernier' : seul le dernier séjour compte, −1 au plus
  const ptsSejour = s => s.an===N-1 ? (s.vac?4:3) : (s.an===N-2||s.an===N-3) ? (s.vac?2:1) : 0;
  function noteDe(sej, refusAns, mode){

    const an = der?der.an:null; let cat='aucun';
    if(an===N-1) cat = der.vac?'vacN1':'horsVacN1'; else if(an===N-2||an===N-3) cat = der.vac?'vacN2N3':'horsVacN2N3';
    const ansRefus=[...new Set(refusAns)].sort(), dr = ansRefus.length?ansRefus[ansRefus.length-1]:null;
    const bonusAns = ansRefus.filter(y => an===null || y-an>=4);
    const det = sej.filter(s=>s.an>=N-3 && s.an<=N-1).sort((a,b)=>(a.debut||'').localeCompare(b.debut||'')).map(s=>({an:s.an, debut:s.debut, vac:s.vac, pts:ptsSejour(s)}));
    let note, bonus;
    if(mode==='dernier'){ note=NOTES[cat]; bonus = bonusAns.length ? -1 : 0; }
    else { note=det.reduce((t,s)=>t+s.pts,0); bonus=-bonusAns.length; }

  function rapprocher(data, base, overrides, mode){

      for(const al of (ovr.alias||[])) c=c.concat(cle(al.nom,al.prenom));
      let sej=base.sejours.filter(s=>s.an<N && proche(c,s.cles));
      const tousRefs=[...new Set(sej.map(s=>s.ref))].sort();
      let refAn=base.refus.filter(x=>x.an<N && proche(c,x.cles));
      if(ovr.ignorerRefus) refAn=[];
      let refs=tousRefs, statut, sc, ref, alt={};
      if(Array.isArray(ovr.refs)){ sej=sej.filter(s=>ovr.refs.includes(s.ref)); refs=ovr.refs.slice(); }
      if(ovr.refs==='tous' && refs.length>1){ sc=noteDe(sej,refAn.map(x=>x.an),mode); ref=refs.join(' + '); statut='trouvé (plusieurs réf.)'; }
      else if(refs.length<=1){ statut = refs.length?'trouvé':(refAn.length?'refus seul':'aucune trace'); sc=noteDe(sej,refAn.map(x=>x.an),mode); ref=refs[0]||null; }
      else { statut='ambigu';
        for(const rf of refs) alt[rf]=noteDe(sej.filter(s=>s.ref===rf),refAn.map(x=>x.an),mode);
        ref=refs.reduce((m,x)=>alt[x].score>alt[m].score?x:m, refs[0]); sc=alt[ref]; sej=sej.filter(s=>s.ref===ref); }
      const fid='F'+String(k).padStart(2,'0');
      const fo={id:fid, cf, nom, prenom, branche:r.branche, br:(String(r.branche).match(/\(([\d.]+)\)/)||[])[1]||'', corresp:r.corresp, email:r.email,
        horodateur:r.horodateur, option:r.option, commentaire:r.commentaire||'', statut, ref, refs, tousRefs, alt, sejours:sej, refusTrouves:refAn,
        service:!!ovr.service, alias:ovr.alias||[], ...sc};
      foyers.push(fo);
      r.choix.forEach((ch,i)=>{ if(!ch||!ch[0]||!ch[1]) return; const [d,f]=ch, n=nuits(d,f);
        demandes.push({id:fid+'#'+(i+1), cle:cf+'#'+(i+1), fid, choix:i+1, debut:d, fin:f, nuits:n, demDebut:d, demFin:f,
          valide: d.slice(0,4)===String(N) && n>0 && n<=CONFIG.nuitsMax, semaine:n===7, ...tarif(d,f)}); });

  // ── Attribution ──
  // 0. décisions du comité ; A. attribution directe (seul demandeur) ;
  // B/C. acceptation différée : chaque foyer demande ses choix dans l'ordre, une demande tient tant qu'aucune demande prioritaire ne la chevauche.
  // p : {modeA:'iteratif'|'meilleur', noelMin:7, semComplete:['Printemps'], ordre:[…], ajust:{cle:{debut,fin,note}}, exclus:{cle:motif}, forces:[cle]}
  function attribuer(foyers, demandes, p){
    const F=Object.fromEntries(foyers.map(f=>[f.id,f]));
    const NOEL=VAC.filter(([a])=>NOM_VAC[a]==='Noël'&&a.startsWith(String(N)));

      if(p.noelMin && NOEL.some(([a,b])=>x.debut<=b && a<x.fin) && x.nuits<p.noelMin){

      const per=[...Array(x0.nuits).keys()].map(i=>periodeVac(plus(x0.debut,i))).filter(Boolean);
      x.periode=per[0]||null; x.court = (x0.nuits<7 && per.some(v=>semC.includes(v))) ? 1 : 0;

    const cleTri = x => { const f=F[x.fid]; const k=[x.court||0, f.score]; for(const c of ordre) k.push(CRITERES[c].val(x,f)); return k; };
    const cmp=(a,b)=>{ for(let i=0;i<a.length;i++){ if(a[i]<b[i]) return -1; if(a[i]>b[i]) return 1; } return 0; };
    const nomCmp=(x,y)=> x.choix!==y.choix ? x.choix-y.choix : (F[x.fid].nom<F[y.fid].nom?-1:F[x.fid].nom>F[y.fid].nom?1:0);
    const bat=(x,y)=>{ const c=cmp(cleTri(x),cleTri(y)); return c<0 || (c===0 && nomCmp(x,y)<0); };
    function motif(g,l){
      const fg=F[g.fid], fl=F[l.fid];
      if((g.court||0)!==(l.court||0)) return 'semaine complète prioritaire';
      if(fg.score!==fl.score) return 'note';
      for(const c of ordre){ if(CRITERES[c].val(g,fg)!==CRITERES[c].val(l,fl)) return CRITERES[c].lib; }
      return 'comité';
    }
    const ORD=['semaine complète prioritaire','note',...ordre.map(c=>CRITERES[c].lib),'comité'];
    const attrib=[], servis=new Set();
    const libres = x => !attrib.some(a=>chevauche(a.d,x));
    const concurrentsDe = x => dem.filter(y=>y.fid!==x.fid && !servis.has(y.fid) && chevauche(x,y));
    // 0. Décisions du comité
    for(const k of (p.forces||[])){ const x=dem.find(d=>d.cle===k); if(!x||servis.has(x.fid)||!libres(x)) continue;
      attrib.push({d:x, etape:'F', note_choix:false}); servis.add(x.fid); }
    // A. Attribution directe
    if(p.modeA==='meilleur'){
      // seulement quand le choix sans concurrent est le meilleur choix du foyer ; les autres servent de filet dans l'étape suivante
      for(const x of dem){ if(servis.has(x.fid) || !libres(x) || concurrentsDe(x).length) continue;
        if(dem.some(y=>y.fid===x.fid && y.choix<x.choix)) continue;
        attrib.push({d:x, etape:'A', note_choix:false}); servis.add(x.fid); }
    } else {
      // règle votée, appliquée en boucle : chaque attribution libère les autres choix du foyer servi, ce qui peut laisser un autre foyer seul
      for(let encore=true; encore;){ encore=false;
        const best=new Map();
        for(const x of dem){ if(servis.has(x.fid) || !libres(x) || concurrentsDe(x).length) continue; const c=best.get(x.fid); if(!c||x.choix<c.choix) best.set(x.fid,x); }
        const tri=[...best.values()].sort((a,b)=>a.choix-b.choix);

    }
    const bloque={};

    return {attrib, nonServis, irrecevables, bloque, dem, cleTri, bat};

})();

const fmtJ = iso => iso ? `${+iso.slice(8,10)} ${MOIS[+iso.slice(5,7)-1]}` : '';
const fmtJA = iso => iso ? `${fmtJ(iso)} ${iso.slice(0,4)}` : '';
const MOIS_C = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fmtC = iso => iso ? `${+iso.slice(8,10)} ${MOIS_C[+iso.slice(5,7)-1]}` : '';
function periode(d, f){
  if(d.slice(0,4)!==f.slice(0,4)) return `du ${fmtJA(d)} au ${fmtJA(f)}`;
  if(d.slice(5,7)===f.slice(5,7)) return `du ${+d.slice(8,10)} au ${fmtJA(f)}`;
  return `du ${fmtJ(d)} au ${fmtJA(f)}`;
}
const perC = (d,f) => `${fmtC(d)} → ${fmtC(f)}`;
const eur = v => v==null ? '' : Math.round(v).toLocaleString('fr-FR').replace(/ | /g,' ') + ' €';
const nrm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[º°]/g,'').replace(/\s+/g,' ').trim();
const scoreCls = s => s<0?'s-neg':s===0?'s-0':s===1?'s-1':s===2?'s-2':'s-3';
const pl = (n, mot, plur) => `${n} ${n>1?(plur||mot+'s'):mot}`;
function capMot(w){ return w.split('-').map(p => p.length>1 && (p===p.toUpperCase() || p===p.toLowerCase()) ? p.charAt(0).toUpperCase()+p.slice(1).toLowerCase() : p).join('-'); }
function nomPropre(f){
  let p = String(f.prenom||'').trim(), n = String(f.nom||'').trim();
  const pa = /\s*\(demande formul[ée]e par [^)]*\)\s*/i; p = p.replace(pa,' ').trim(); n = n.replace(pa,' ').trim();
  n = n.replace(/^(\S+)\s+\1\b/i,'$1');
  if(n.toLowerCase().startsWith(p.toLowerCase()+' ')) n = n.slice(p.length+1);

function explNote(f){
  let t;
  if(f.modeNote==='dernier'){
    if(f.nb===0) t = 'aucun séjour dans l\'historique';
    else if(f.cat==='aucun') t = `dernier séjour en ${f.an}, avant ${E.N-3}`;
    else t = E.LIB_CAT[f.cat];
    if(f.bonus) t += `, avec un bonus de −1 pour un refus en ${f.refus}${f.an ? `, ${f.refus-f.an} ans après le dernier séjour` : ''}`;
    return t;
  }
  if(!f.det || !f.det.length) t = f.nb===0 ? 'aucun séjour dans l\'historique' : `aucun séjour depuis ${E.N-3} (dernier en ${f.an})`;
  else t = f.det.map(s => `séjour ${s.vac?'en vacances':'hors vacances'} en ${s.an} : ${s.pts}`).join(', ');
  if(f.bonus) t += `, ${f.bonusAns.length>1?'refus':'refus'} de ${f.bonusAns.join(' et ')} : ${noteTxt(f.bonus)}${f.an?` (dernier séjour en ${f.an})`:''}`;

}
const noteTxt = s => s<0 ? '−'+Math.abs(s) : String(s);
function libEtape(a){
  const m = a.motifs.filter(x => x!=='note');
  switch(a.etape){
    case 'F': return 'Décision du comité' + (S.raisons['force:'+a.d.cle] ? ' : '+S.raisons['force:'+a.d.cle] : '');
    case 'A': return a.note_choix ? 'Attribution directe : seul demandeur (choix mieux classés perdus)' : 'Attribution directe : seul demandeur';
    case 'A2': return 'Seul demandeur restant : les autres ont été servis ailleurs';
    case 'B': return `Note la plus basse (${pl(a.concurrents.length,'concurrent')})`;
    case 'C': { const per = DE_VAC[a.d.periode] || 'des vacances';
      const t = a.motifs.filter(x => x!=='comité').map(x => x==='note' ? 'note la plus basse' : x==='semaine complète prioritaire' ? `semaine complète prioritaire pendant les vacances ${per}` : `à note égale, ${x}`).join(' ; ');
      return t.charAt(0).toUpperCase() + t.slice(1) + ` (${pl(a.concurrents.length,'concurrent')})`; }
    case 'C*': return 'Égalité parfaite : à trancher par le comité';
  }
  return a.etape;
}
const DE_VAC = {'Hiver':'d\'hiver','Printemps':'de printemps','Été':'d\'été','Toussaint':'de la Toussaint','Noël':'de Noël'};
const perDe = x => { for(let i=0;i<x.nuits;i++){ const v = E.periodeVac(E.plus(x.debut,i)); if(v) return v; } return null; };
const TAG_ETAPE = {A:['A','t-ok'], A2:['A','t-ok'], B:['B','t-info'], C:['C','t-gold'], 'C*':['Égalité','t-warn'], F:['Comité','t-force']};
function phrasePerte(z, x, C){
  // z : demande retenue, x : demande écartée
  const g = C.F[z.fid], l = C.F[x.fid], a = C.attribDe.get(z.fid);
  const qui = S.nommer ? nomF(g) : 'un autre foyer';
  const bl = (C.bloque[x.id]||[]).find(b => b.fid===z.fid);
  if(a && a.etape==='F'){ const r = S.raisons['force:'+a.d.cle]; return `attribué à ${qui} par décision du comité${r && !/famille de plus/.test(r) ? ' ('+r+')' : ''}`; }
  if(bl && bl.ok===false) return `attribué à ${qui} par décision du comité`;
  const m = bl?.motif || 'note';
  const motifs = {
    'note': `revenu à ${qui}${S.nommer?',':''} dont la note était plus basse (${noteTxt(g.score)} contre ${noteTxt(l.score)})`,
    'semaine complète prioritaire': `revenu à ${qui} qui demandait une semaine complète : pendant les vacances ${DE_VAC[x.periode||perDe(x)]||'scolaires'}, les semaines complètes passent avant les séjours courts`,
    'semaine complète': `revenu, à note égale, à ${qui} qui demandait une semaine complète`,
    'premier séjour': `revenu, à note égale, à ${qui} qui n'était encore jamais venu`,
    'ancienneté du dernier séjour': `revenu, à note égale, à ${qui} dont le dernier séjour était plus ancien`,
    'service rendu': `revenu, à note égale, à ${qui} pour service rendu à l'association`,
    'comité': `revenu à ${qui} après examen par le comité d'une égalité parfaite`,
  };
  return motifs[m] || `revenu à ${qui}`;
}
function issueChoix(C, f, x){
  // renvoie {etat:'gagne'|'perdu'|'irr'|'invalide'|'neutre', texte}
  const a = C.attribDe.get(f.id);
  if(!x.valide) return {etat:'invalide', texte:`dates hors ${E.N} ou séjour de plus de ${CONFIG.nuitsMax} nuits : demande non examinée`};
  const irr = C.irrDe.get(x.id); if(irr) return {etat:'irr', texte:`non recevable : ${irr.motif}`};
  if(a && a.d.choix===x.choix) return {etat:'gagne', texte: a.d.reserve ? `attribué ${periode(a.d.debut,a.d.fin)}, sous réserve d'accord (${a.d.reserve})` : 'attribué'};
  if(a && a.d.choix<x.choix) return {etat:'neutre', texte:`non examiné : le choix n°${a.d.choix} a été obtenu`};
  if(a && a.etape==='A' && a.d.choix>x.choix) return {etat:'perdu', texte:`non retenu : votre choix n°${a.d.choix} vous a été attribué directement, car vous étiez seul à le demander ; selon les règles de l'association, vos autres demandes ne sont alors plus examinées`};
  if(a && a.etape==='F' && a.d.choix>x.choix){ const r = S.raisons['force:'+a.d.cle]; return {etat:'perdu', texte:`non retenu : le comité vous a attribué votre choix n°${a.d.choix}${r?', '+r:''}`}; }
  const bl = C.bloque[x.id] || [];
  if(!bl.length) return {etat:'perdu', texte:'non attribué'};
  const zs = bl.map(b => C.attribDe.get(b.fid)?.d).filter(Boolean);
  return {etat:'perdu', texte: zs.map(z => phrasePerte(z, x, C)).join(' ; ')};
}
function criteresTxt(){
  const lib = {semaine:'à la semaine complète', premier:'au premier séjour', anciennete:'à l\'ancienneté du dernier séjour', service:'au service rendu'};
  const C = calc(); const ord = S.p.ordre.filter(c => c!=='service' || C.foyers.some(f => f.service));
  return 'priorité ' + ord.map(c => lib[c]).join(', puis ');
}
function varsFoyer(f){
  const C = calc(), a = C.attribDe.get(f.id), np = nomPropre(f);
  const dems = C.demandes.filter(x => x.fid===f.id);
  const ligne = x => { const r = issueChoix(C, f, x); return `• Choix n°${x.choix}, ${periode(x.demDebut, x.demFin)} : ${r.texte}.`; };
  const v = {lieu:CONFIG.lieu, annee:E.N, signature:CONFIG.signature, association:CONFIG.association, prenom:np.prenom, nom:np.nom, note:noteTxt(f.score), explication_note:explNote(f), criteres:criteresTxt(),
    correspondant: f.corresp || 'votre correspondant de branche', date_reponse: fmtJA(S.dates.reponse),
    detail_choix: dems.map(ligne).join('\n'), periode:'', nuits:'', choix:'', ligne_prix:'', prix:'', autres_choix:'', periode_demandee:'', reserve:''};
  if(a){
    const x = a.d; v.periode = periode(x.debut, x.fin); v.nuits = x.nuits; v.choix = x.choix;
    v.periode_demandee = periode(x.demDebut, x.demFin); v.reserve = x.reserve || '';
    const p = prixDe(x);
    if(S.prix && p){ v.prix = eur(p.val); v.ligne_prix = p.propose ? `Le tarif de ce séjour est en cours de validation (environ ${eur(p.val)}).\n` : `Le tarif ${E.N} de ce séjour (${p.lib}) est de ${eur(p.val)}.\n`; }
    const mieux = dems.filter(y => y.choix < x.choix);
    if(mieux.length) v.autres_choix = '\nVos choix mieux classés n\'ont pas pu être retenus :\n' + mieux.map(ligne).join('\n') + '\n';
  }
  return v;
}
function lettre(f){
  const C = calc(), a = C.attribDe.get(f.id);
  const mod = !a ? S.modeles.refus : (a.d.reserve ? S.modeles.reserve : S.modeles.accord);
  const v = varsFoyer(f); let t = mod;
  for(const [k,val] of Object.entries(v)) t = t.split('{'+k+'}').join(String(val));
  return t.replace(/\n{3,}/g, '\n\n');
}

function vueSynthese(){
  const C = calc();
  const servis = C.attrib.length, choix1 = C.attrib.filter(a => a.d.choix===1).length;
  const grille = C.attrib.reduce((s,a) => s + (a.d.prix||0), 0), nG = C.attrib.filter(a => a.d.prix!=null).length;
  const prop = C.attrib.filter(a => a.d.prix==null && a.d.propose), propT = prop.reduce((s,a) => s + a.d.propose.prix, 0);
  let h = `<h2>Synthèse</h2><p class="lead">Répartition calculée avec ${esc(CONFIG.reglesVotees)} et les décisions du comité. Tout se recalcule dès qu'une règle, un rapprochement ou une décision change.</p>
  <div class="stats">
    <div class="stat"><div class="v num">${C.demandes.length}</div><div class="l">demandes de ${C.foyers.length} foyers</div></div>
    <div class="stat"><div class="v num">${servis}</div><div class="l">foyers servis au premier tour</div></div>
    <div class="stat"><div class="v num">${choix1}</div><div class="l">sur leur premier choix</div></div>
    <div class="stat"><div class="v num">${C.nonServis.length}</div><div class="l">foyers non servis (2e tour)</div></div>
    ${S.prix ? `<div class="stat"><div class="v num">${eur(grille)}</div><div class="l">recette des ${nG} séjours dans la grille${prop.length?`, plus ≈ ${eur(propT)} pour ${pl(prop.length,'séjour')} hors grille`:''}</div></div>` : ''}
  </div>`;
  // À faire
  const todo = [];
  const amb = C.foyers.filter(f => f.statut==='ambigu');
  if(amb.length) todo.push(['w', `${pl(amb.length,'foyer')} avec des séjours sous plusieurs références : choisir lesquels compter (${amb.map(nomF).join(', ')}).`, 'demandes', 'ambigu']);
  const plus = C.foyers.filter(f => f.statut.startsWith('trouvé (plusieurs'));
  if(plus.length) todo.push(['w', `À vérifier avec les correspondants : ${plus.map(f => `${nomF(f)} (${f.ref})`).join(', ')}. Tous leurs séjours sont comptés.`, 'demandes', 'plusieurs']);
  const sansTrace = C.foyers.filter(f => f.statut==='aucune trace');
  if(sansTrace.length) todo.push(['ok', `${pl(sansTrace.length,'foyer')} sans trace dans l'historique, traités comme un premier séjour.`, 'demandes', 'aucune trace']);
  const res = C.attrib.filter(a => a.d.reserve && statutAtt(a)==='attribué');
  for(const a of res) todo.push(['w', `Obtenir l'accord de ${nomF(C.F[a.d.fid])} : ${a.d.reserve} (${perC(a.d.debut,a.d.fin)}).`, 'attribution', a.d.cle]);
  const ega = C.attrib.filter(a => a.etape==='C*');
  for(const a of ega){ const autres = (a.parMotif['comité']||[]).map(i => nomF(C.F[i])).join(', ');
    todo.push(['w', `Égalité parfaite ${perC(a.d.debut,a.d.fin)} entre ${nomF(C.F[a.d.fid])} et ${autres} : vérifier l'arbitrage proposé.`, 'attribution', a.d.cle]); }
  for(const x of C.irrecevables) todo.push(['ok', `Demande non recevable : ${nomF(C.F[x.fid])}, ${perC(x.debut,x.fin)} (${x.motif}).`, 'attribution', '']);
  if(prop.length) todo.push(['w', `${pl(prop.length,'séjour attribué','séjours attribués')} hors grille tarifaire : la règle de prix proposée reste à valider.`, 'attribution', '']);
  h += `<div class="grid2"><div><h3>À vérifier</h3>${todo.length ? todo.map(([c,t,o,ref]) => `<div class="todo ${c}"><span class="ic">${c==='ok'?'✓':'!'}</span><div>${esc(t)} <button class="lien small" data-act="aller" data-v="${o}" data-ref="${esc(ref)}">voir</button></div></div>`).join('') : '<div class="note note-ok">Rien en attente.</div>'}
    <h3>Décisions du comité</h3>${journalDecisions()}</div>
    <div>${blocRegles()}</div></div>`;
  return h;

function journalDecisions(){
  const C = calc(), L = [];
  const parCle = new Map(C.demandes.map(x => [x.cle, x]));
  const qui = k => { const x = parCle.get(k); return x ? `${nomF(C.F[x.fid])}, choix n°${x.choix}` : k; };
  for(const k of S.p.forces) L.push(['Attribué par le comité', qui(k), S.raisons['force:'+k], 'force', k]);
  for(const [k,v] of Object.entries(S.p.ajust)) L.push([`Dates modifiées : ${perC(v.debut,v.fin)}, sous réserve`, qui(k), S.raisons['ajust:'+k], 'ajust', k]);
  for(const [k,v] of Object.entries(S.p.exclus)) L.push(['Demande écartée', qui(k), v, 'exclus', k]);
  for(const [cf,o] of Object.entries(S.ovr)){ const f = C.foyers.find(z => z.cf===cf); if(!f) continue;
    const quoi = [o.refs==='tous'?'toutes les références comptées':Array.isArray(o.refs)?`références retenues : ${o.refs.join(', ')||'aucune'}`:'', o.ignorerRefus?'refus ignorés':'', (o.alias||[]).length?`séjours de ${o.alias.map(x=>x.prenom+' '+x.nom).join(', ')} comptés`:'', o.service?'service rendu':''].filter(Boolean).join(' ; ');
    if(quoi) L.push([`Rapprochement : ${quoi}`, nomF(f), S.raisons['ovr:'+cf], 'ovr', cf]); }
  if(!L.length) return '<p class="muted small">Aucune décision pour l\'instant.</p>';
  return L.map(([t,q,r,type,k]) => `<div class="todo ok"><span class="ic">✓</span><div style="flex:1"><b>${esc(q)}</b> · ${esc(t)}${r?`<div class="mini">${esc(r)}</div>`:''}</div><button class="btn btn-line btn-sm" data-act="annuler-dec" data-type="${type}" data-k="${esc(k)}">Annuler</button></div>`).join('');
}

function tagStatut(f){
  const m = {'trouvé':['historique','t-ok'], 'refus seul':['refus seul','t-info'], 'aucune trace':['premier séjour','t-info'], 'ambigu':['plusieurs réf.','t-bad']};
  if(f.statut.startsWith('trouvé (plusieurs')) return `<span class="tag t-warn" title="Tous les séjours comptés, à vérifier">plusieurs réf.</span>`;
  const [l,c] = m[f.statut] || [f.statut,'t-gris']; return `<span class="tag ${c}">${l}</span>`;
}
function tableDemandes(){
  const C = calc(); let fs = C.foyers.slice();
  if(S.ui.q){ const q = nrm(S.ui.q); fs = fs.filter(f => nrm(f.nom+' '+f.prenom+' '+(f.ref||'')+' '+f.corresp).includes(q)); }
  if(S.ui.br) fs = fs.filter(f => f.branche===S.ui.br);
  if(S.ui.filtre==='servis') fs = fs.filter(f => C.attribDe.has(f.id));
  if(S.ui.filtre==='non') fs = fs.filter(f => !C.attribDe.has(f.id));
  if(S.ui.filtre==='verif') fs = fs.filter(f => f.statut!=='trouvé' || S.ovr[f.cf]);
  if(['ambigu','plusieurs','aucune trace'].includes(S.ui.filtre)) fs = fs.filter(f => S.ui.filtre==='plusieurs' ? f.statut.startsWith('trouvé (plusieurs') : f.statut===S.ui.filtre);
  fs.sort((a,b) => a.branche.localeCompare(b.branche) || a.score-b.score || nomF(a).localeCompare(nomF(b)));
  if(!fs.length) return '<div class="note">Aucun foyer ne correspond à ces filtres.</div>';
  const rows = fs.map(f => {
    const a = C.attribDe.get(f.id), dems = C.demandes.filter(x => x.fid===f.id);
    const ch = [1,2,3].map(i => { const x = dems.find(y => y.choix===i); if(!x) return '<td class="mini">—</td>';
      const r = issueChoix(C, f, x); const cls = r.etat==='gagne'?'gagne':(r.etat==='irr'||r.etat==='invalide')?'barre':'';
      return `<td><span class="ch ${cls}">${perC(x.demDebut,x.demFin)}</span><span class="mini">${x.nuits} n.${S.prix?' · '+prixHTML(x):''}</span></td>`; }).join('');
    const res = a ? `<span class="tag ${a.d.reserve?'t-warn':'t-ok'}">choix ${a.d.choix}${a.d.reserve?', sous réserve':''}</span>` : '<span class="tag t-bad">non servi</span>';
    const open = S.ui.ouvert===f.cf;
    return `<tr class="clic ${open?'sel':''}" data-act="ouvrir" data-v="${esc(f.cf)}"><td><b>${esc(nomF(f))}</b>${f.service?' <span class="tag t-gold">service rendu</span>':''}<div class="mini">${esc(f.corresp||'')}${f.ref?' · '+esc(f.ref):''}</div></td>
      <td class="nowrap">${esc(f.br)}</td><td><span class="score ${scoreCls(f.score)}">${noteTxt(f.score)}</span> ${tagStatut(f)}</td>${ch}<td>${res}</td></tr>
      ${open?`<tr><td colspan="7" style="padding:0">${detailFoyer(f)}</td></tr>`:''}`;
  }).join('');
  return `<div class="tbl-wrap"><table class="t"><thead><tr><th>Foyer</th><th>Br.</th><th>Note</th><th>Choix 1</th><th>Choix 2</th><th>Choix 3</th><th>Résultat</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="mini" style="margin-top:6px">${pl(fs.length,'foyer')} affiché${fs.length>1?'s':''}.${S.prix&&S.hgPropose?' * prix proposé pour une demande hors grille, à valider.':''}</p>`;
}
function detailFoyer(f){
  const C = calc(), o = S.ovr[f.cf] || {};

  for(const s of tous){ (parRef[s.ref] = parRef[s.ref] || []).push(s); }
  const refsRetenues = Array.isArray(o.refs) ? o.refs : (o.refs==='tous' ? Object.keys(parRef) : (f.statut==='ambigu' ? [f.ref] : Object.keys(parRef)));
  const blocRefs = Object.keys(parRef).length ? Object.entries(parRef).sort().map(([r,ss]) => `<div class="ligne-ref"><label><input type="checkbox" data-act="ref" data-cf="${esc(f.cf)}" data-ref="${esc(r)}" ${refsRetenues.includes(r)?'checked':''}> <b>${esc(r)}</b></label>
      <span class="mini">${ss.sort((a,b)=>(b.debut||'').localeCompare(a.debut||'')).slice(0,6).map(s => `${s.an}${s.vac?' (vac.)':''} ${esc(capMot(s.prenom))}`).join(' · ')}${ss.length>6?' …':''}</span></div>`).join('')
    : '<p class="small muted">Aucun séjour trouvé à ce nom dans l\'historique.</p>';
  const refus = f.refusTrouves.length || o.ignorerRefus ? `<label class="ligne-ref"><input type="checkbox" data-act="ign-refus" data-cf="${esc(f.cf)}" ${o.ignorerRefus?'checked':''}> Ignorer les refus trouvés à ce nom</label><div class="mini">${BASE.refus.filter(x => E.proche(E.cle(f.nom,f.prenom), x.cles)).map(x => `${x.an} : ${esc(x.prenom)} ${esc(x.nom)}${x.ref?' ('+esc(x.ref)+')':''}${x.src==='déduit'?' · déduit des demandes '+(E.N-1):''}`).join(' · ') || 'aucun'}</div>` : '<p class="small muted">Aucun refus enregistré.</p>';
  return `<div class="detail"><div class="grid2"><div>
      <h4 style="margin-top:0">Note ${noteTxt(f.score)} : ${esc(explNote(f))}</h4>
      <p class="small">${f.nb ? `${pl(f.nb,'séjour')} dans l'historique, le dernier ${f.dernier?'le '+fmtJA(f.dernier):'en '+f.an}${f.vac?' (en vacances)':''}.` : 'Jamais venu d\'après l\'historique.'}</p>
      <h4>Séjours comptés</h4>${blocRefs}
      <h4>Refus</h4>${refus}
      <h4>Compter aussi les séjours d'une autre personne du foyer</h4>
      ${(o.alias||[]).map((x,i) => `<div class="ligne-ref">${esc(x.prenom)} ${esc(x.nom)} <button class="btn btn-line btn-sm" data-act="alias-del" data-cf="${esc(f.cf)}" data-i="${i}">Retirer</button></div>`).join('')}
      <div class="form-inline"><input type="text" placeholder="Nom" id="al-nom"><input type="text" placeholder="Prénom" id="al-pre"><button class="btn btn-line btn-sm" data-act="alias-add" data-cf="${esc(f.cf)}">Ajouter</button></div>
    </div><div>
      <label class="ligne-ref"><input type="checkbox" data-act="service" data-cf="${esc(f.cf)}" ${o.service?'checked':''}> <b>Service rendu à l'association</b></label>
      <p class="mini">Critère de départage à note égale, au rang ${S.p.ordre.indexOf('service')+1}.</p>
      <h4>Note du comité</h4>
      <div class="form-inline"><input type="text" style="flex:1" value="${esc(S.raisons['ovr:'+f.cf]||'')}" data-in="raison-ovr" data-cf="${esc(f.cf)}" placeholder="Pourquoi ce rapprochement…"></div>
      <h4>Message du demandeur</h4><p class="small" style="white-space:pre-wrap">${esc(f.commentaire||'—')}</p>
      <p class="mini" style="margin-top:8px">${f.email?esc(f.email)+' · ':''}${f.option?esc(CONFIG.libelleOption)+' : '+esc(f.option)+' · ':''}reçu le ${esc(String(f.horodateur||'').slice(0,10))}</p>
    </div></div></div>`;
}

/* ═══════════════ ATTRIBUTION ═══════════════ */
function vueAttribution(){
  const C = calc();
  const ega = C.attrib.filter(a => a.etape==='C*'), res = C.attrib.filter(a => a.d.reserve), frc = C.attrib.filter(a => a.etape==='F');
  const tot = C.attrib.filter(a => statutAtt(a)!=='annulé').reduce((s,a) => s + (prixDe(a.d)?.val||0), 0);
  let h = `<h2>Attribution du premier tour</h2><p class="lead">${pl(C.attrib.length,'séjour attribué','séjours attribués')}, dans l'ordre du calendrier. Ouvrez un séjour pour voir les concurrents écartés et, si besoin, enregistrer une décision du comité : attribuer à un autre foyer, décaler les dates sous réserve d'accord, ou écarter la demande.</p>`;
  if(ega.length) h += `<div class="note note-warn"><b>${pl(ega.length,'égalité parfaite','égalités parfaites')}</b> : ${ega.map(a => `${perC(a.d.debut,a.d.fin)} (${nomF(C.F[a.d.fid])})`).join(', ')}. L'outil propose un arbitrage ; le comité le confirme ou le change.</div>`;
  if(res.length) h += `<div class="note note-warn"><b>Sous réserve d'accord</b> : ${res.map(a => `${nomF(C.F[a.d.fid])}, ${perC(a.d.debut,a.d.fin)}`).join(' ; ')}</div>`;
  if(frc.length) h += `<div class="note note-force"><b>${pl(frc.length,'décision')} du comité</b> appliquée${frc.length>1?'s':''} avant le calcul.</div>`;
  if(S.prix) h += `<p class="small" style="margin-bottom:10px">Total des séjours attribués : <b>${eur(tot)}</b>${S.hgPropose?' (dont prix proposés hors grille, signalés par *)':' (hors grille non comptés)'}.</p>`;
  h += C.attrib.map(carteAtt).join('');
  if(C.irrecevables.length) h += `<h3>Demandes non recevables</h3>` + C.irrecevables.map(x => `<div class="cand"><span class="q"><b>${esc(nomF(C.F[x.fid]))}</b>, choix n°${x.choix}, ${perC(x.debut,x.fin)}<div class="mini">${esc(x.motif)}</div></span>${S.p.exclus[x.cle]?`<button class="btn btn-line btn-sm" data-act="annuler-dec" data-type="exclus" data-k="${esc(x.cle)}">Rétablir</button>`:'<span class="mini">règle de Noël (onglet Synthèse)</span>'}</div>`).join('');
  return h;
}
function carteAtt(a){
  const C = calc(), x = a.d, f = C.F[x.fid], open = S.ui.attOuvert===x.cle, st = statutAtt(a);
  const [t,c] = TAG_ETAPE[a.etape] || [a.etape,'t-gris'];
  const vac = E.periodeVac(x.debut);
  const cls = ['att', open?'open':'', a.etape==='F'?'f':'', x.reserve?'r':'', st==='annulé'?'ann':''].join(' ');
  let h = `<div class="${cls}" id="att-${esc(x.cle)}"><button class="att-head" data-act="att" data-v="${esc(x.cle)}" aria-expanded="${open}">
    <div class="att-date"><span class="d">${perC(x.debut,x.fin)}</span><small>${x.nuits} nuits${vac?' · '+vac:''}</small></div>
    <div class="att-main"><div><div class="who">${esc(nomF(f))} <span class="mini">· br. ${esc(f.br)} · choix n°${x.choix}</span></div><div class="how">${esc(libEtape(a))}${x.reserve?' · <b>sous réserve</b> : '+esc(x.reserve):''}</div></div>
    <div class="att-side">${prixHTML(x)}<span class="score ${scoreCls(f.score)}" title="Note">${noteTxt(f.score)}</span><span class="tag ${c}">${t}</span>${st!=='attribué'?`<span class="tag ${st==='annulé'?'t-bad':'t-ok'}">${st}</span>`:''}</div></div>
    <span class="chev">▾</span></button>`;
  if(open){
    const autres = C.dem.filter(y => y.fid!==x.fid && E.chevauche(x,y));
    const ecartes = Object.entries(a.parMotif).flatMap(([m,ids]) => ids.map(i => [m,i]));
    h += `<div class="detail"><div class="grid2"><div>
      <h4 style="margin-top:0">Concurrents écartés</h4>
      ${ecartes.length ? ecartes.map(([m,i]) => { const g = C.F[i], y = autres.find(z => z.fid===i); return `<div class="cand"><span class="score ${scoreCls(g.score)}">${noteTxt(g.score)}</span><span class="q"><b>${esc(nomF(g))}</b> · br. ${esc(g.br)}${y?` · choix n°${y.choix}, ${perC(y.debut,y.fin)}`:''}<div class="mini">écarté par : ${esc(m)}${C.attribDe.has(i)?` · servi ailleurs (choix n°${C.attribDe.get(i).d.choix})`:''}</div></span></div>`; }).join('') : '<p class="small muted">Aucun : personne d\'autre n\'attendait ces dates.</p>'}
      ${autres.filter(y => !ecartes.some(([,i]) => i===y.fid)).length ? `<h4>Autres demandes sur ces dates</h4>${autres.filter(y => !ecartes.some(([,i]) => i===y.fid)).map(y => `<div class="cand"><span class="score ${scoreCls(C.F[y.fid].score)}">${noteTxt(C.F[y.fid].score)}</span><span class="q">${esc(nomF(C.F[y.fid]))} · choix n°${y.choix}, ${perC(y.debut,y.fin)}<div class="mini">${C.attribDe.has(y.fid)?`servi par son choix n°${C.attribDe.get(y.fid).d.choix}`:'écarté par un autre séjour'}</div></span></div>`).join('')}` : ''}
      <h4>Suivi</h4><div class="form-inline">${['attribué','confirmé','annulé'].map(s => `<button class="chip ${st===s?'on':''}" data-act="statut" data-k="${esc(x.cle)}" data-v="${s}">${s}</button>`).join('')}</div>
      ${x.demDebut!==x.debut||x.demFin!==x.fin?`<p class="mini" style="margin-top:6px">Dates demandées : ${perC(x.demDebut,x.demFin)}.</p>`:''}
      ${S.raisons['ajust:'+x.cle]||S.raisons['force:'+x.cle]?`<div class="note note-force small">${esc(S.raisons['ajust:'+x.cle]||S.raisons['force:'+x.cle])}</div>`:''}
    </div><div class="dec-box">
      <h5>Décision du comité</h5>
      ${autres.length ? `<div class="form-inline"><select id="force-${esc(x.cle)}">${autres.map(y => `<option value="${esc(y.cle)}">${esc(nomF(C.F[y.fid]))} (note ${noteTxt(C.F[y.fid].score)}), choix n°${y.choix}, ${perC(y.debut,y.fin)}</option>`).join('')}</select></div>
        <div class="form-inline"><input type="text" style="flex:1" placeholder="Motif de la décision" id="force-r-${esc(x.cle)}"><button class="btn btn-force btn-sm" data-act="forcer" data-k="${esc(x.cle)}">Attribuer à ce foyer</button></div>` : '<p class="mini">Aucune autre demande sur ces dates.</p>'}
      <div class="form-inline" style="margin-top:10px"><input type="date" id="aj-d-${esc(x.cle)}" value="${x.debut}"><input type="date" id="aj-f-${esc(x.cle)}" value="${x.fin}"><input type="text" style="flex:1" placeholder="Ce qui change (ex. arrivée le vendredi)" id="aj-n-${esc(x.cle)}" value="${esc(x.reserve||'')}"><button class="btn btn-force btn-sm" data-act="ajuster" data-k="${esc(x.cle)}">Décaler sous réserve</button></div>
      <div class="form-inline" style="margin-top:10px"><input type="text" style="flex:1" placeholder="Motif (ex. trop court pour la période)" id="ex-r-${esc(x.cle)}"><button class="btn btn-danger btn-sm" data-act="exclure" data-k="${esc(x.cle)}">Écarter cette demande</button></div>
      ${(a.etape==='F'||S.p.ajust[x.cle])?`<div class="form-inline" style="margin-top:10px">${a.etape==='F'?`<button class="btn btn-line btn-sm" data-act="annuler-dec" data-type="force" data-k="${esc(x.cle)}">Annuler l'attribution forcée</button>`:''}${S.p.ajust[x.cle]?`<button class="btn btn-line btn-sm" data-act="annuler-dec" data-type="ajust" data-k="${esc(x.cle)}">Revenir aux dates demandées</button>`:''}</div>`:''}
    </div></div></div>`;
  }
  return h + '</div>';
}

/* ═══════════════ CALENDRIER ═══════════════ */
const COUL_BR_L = CONFIG.couleursBranches;
const COUL_BR = Object.fromEntries(COUL_BR_L);
function occupation(){
  const C = calc(), occ = new Map();
  for(const a of C.attrib){ if(statutAtt(a)==='annulé') continue; for(let i=0;i<a.d.nuits;i++) occ.set(E.plus(a.d.debut,i), {f:C.F[a.d.fid], x:a.d, t:1}); }
  for(const t of S.tour2){ if(t.statut==='décliné') continue; const f = C.foyers.find(z => z.cf===t.cf); if(!f) continue;
    for(let i=0;i<E.nuits(t.debut,t.fin);i++) occ.set(E.plus(t.debut,i), {f, x:t, t:2}); }
  return occ;
}
function vueCalendrier(){
  const occ = occupation(); let h = `<h2>Calendrier ${E.N}</h2><p class="lead">Nuits occupées par les séjours attribués, en couleur par branche. Les jours en vert pâle sont des vacances scolaires (au moins une zone), les points rouges des jours fériés.</p>
  <div class="leg">${COUL_BR_L.map(([b,c]) => `<span><i class="dotc" style="background:${c}"></i>branche ${b}</span>`).join('')}<span><i class="dotc" style="background:var(--vac);border:1px solid #CFE0D8"></i>vacances</span><span><i class="dotc" style="background:repeating-linear-gradient(45deg,#888 0 3px,#bbb 3px 6px)"></i>2e tour</span></div><div class="cal-grid">`;
  for(let m=0;m<13;m++){
    const an = E.N + Math.floor(m/12), mo = m%12, prem = `${an}-${String(mo+1).padStart(2,'0')}-01`;
    const nbj = new Date(Date.UTC(an,mo+1,0)).getUTCDate(), dec = E.jsem(prem);
    if(m===12){ const fin = `${E.N+1}-01-06`; if(![...occ.keys()].some(k => k>=`${E.N+1}-01-01` && k<=fin)) continue; }
    let cells = ''; for(let i=0;i<dec;i++) cells += '<td class="hm"></td>';
    for(let j=1;j<=nbj;j++){ const iso = `${an}-${String(mo+1).padStart(2,'0')}-${String(j).padStart(2,'0')}`, o = occ.get(iso);
      const cl = [E.invac(iso)?'vac':'', E.FER.has(iso)?'fer':'', o?'occ':''].join(' ');
      const st = o ? (o.t===2 ? `background:repeating-linear-gradient(45deg,${COUL_BR[o.f.br]||'#777'} 0 4px,#888 4px 7px)` : `background:${COUL_BR[o.f.br]||'#777'}`) : '';
      cells += `<td class="${cl}" style="${st}" title="${o?esc(nomF(o.f))+(o.t===2?' (2e tour)':''):''}">${j}</td>`;
      if((dec+j)%7===0 && j<nbj) cells += '</tr><tr>'; }
    h += `<div class="cal-mois"><h4>${MOIS[mo].charAt(0).toUpperCase()+MOIS[mo].slice(1)} ${an}</h4><table class="cal-tbl"><tr>${JOURS.map(d => `<th>${d}</th>`).join('')}</tr><tr>${cells}</tr></table></div>`;
  }
  return h + '</div>';
}

/* ═══════════════ FICHES ET COURRIERS ═══════════════ */
function vueCourriers(){
  const C = calc();
  let fs = C.foyers.slice();
  if(S.ui.crFiltre==='servis') fs = fs.filter(f => C.attribDe.has(f.id) && !C.attribDe.get(f.id).d.reserve);
  if(S.ui.crFiltre==='reserve') fs = fs.filter(f => C.attribDe.get(f.id)?.d.reserve);
  if(S.ui.crFiltre==='non') fs = fs.filter(f => !C.attribDe.has(f.id));
  if(S.ui.crQ){ const q = nrm(S.ui.crQ); fs = fs.filter(f => nrm(f.nom+' '+f.prenom).includes(q)); }
  fs.sort((a,b) => nomF(a).localeCompare(nomF(b)));
  if(!C.foyers.length) return '<h2>Fiches et courriers</h2><div class="note">Aucune demande pour l\'instant : importez un classeur avec l\'onglet des demandes rempli.</div>';
  if(!S.ui.fiche || !C.foyers.some(f => f.cf===S.ui.fiche)) S.ui.fiche = (fs[0]||C.foyers[0]).cf;
  const f = C.foyers.find(z => z.cf===S.ui.fiche);
  return `<h2>Fiches et courriers</h2><p class="lead">La fiche reprend, choix par choix, ce qui a été décidé et pourquoi. Le courrier part du modèle correspondant (accord, accord sous réserve, refus), modifiable plus bas.</p>
  <div class="toolbar">${[['tous','Tous'],['servis','Accords'],['reserve','Sous réserve'],['non','Refus']].map(([k,l]) => `<button class="chip ${S.ui.crFiltre===k?'on':''}" data-act="crfiltre" data-v="${k}">${l}</button>`).join('')}
    <input type="search" placeholder="Rechercher…" value="${esc(S.ui.crQ)}" data-in="crQ">
    <button class="toggle ${S.nommer?'on':''}" data-act="nommer"><span class="sw"></span>Nommer les foyers retenus</button>
    <button class="btn btn-teal btn-sm" data-act="brevo">⭳ Export Brevo (${fs.length})</button></div>
  <div class="split"><div class="liste-f" id="liste-f">${fs.map(z => { const a = C.attribDe.get(z.id);
      return `<button class="${z.cf===S.ui.fiche?'on':''}" data-act="fiche" data-v="${esc(z.cf)}"><span>${esc(nomF(z))}</span><span class="tag ${a?(a.d.reserve?'t-warn':'t-ok'):'t-bad'}">${a?(a.d.reserve?'réserve':'choix '+a.d.choix):'refus'}</span></button>`; }).join('') || '<p class="small muted" style="padding:10px">Aucun foyer.</p>'}</div>
  <div>${f ? fiche(f) : ''}</div></div>
  <details class="card" style="margin-top:20px"><summary style="cursor:pointer;font-weight:700">Modèles de courrier</summary>
    <p class="small muted" style="margin:8px 0">Les mots entre accolades sont remplacés pour chaque foyer :</p><div class="vars">${VARS.map(v => `<code>{${v}}</code>`).join('')}</div>
    <div class="grid3">${[['accord','Accord'],['reserve','Accord sous réserve'],['refus','Refus']].map(([k,l]) => `<div><h4 style="margin-top:0">${l}</h4><textarea class="modele" data-in="modele" data-k="${k}">${esc(S.modeles[k])}</textarea></div>`).join('')}</div>
    <button class="btn btn-line btn-sm" style="margin-top:10px" data-act="modeles-def">Rétablir les modèles d'origine</button></details>`;
}
function fiche(f){
  const C = calc(), a = C.attribDe.get(f.id), dems = C.demandes.filter(x => x.fid===f.id);
  return `<div class="fiche"><div class="en-tete"><div><div class="t">${esc(nomF(f))}</div><div class="mini">Branche ${esc(f.br)} · ${esc(f.corresp||'')} · ${esc(f.ref||'sans référence')}</div></div>

    ${a && C.attribDe.get(f.id).etape!=='A' && C.attribDe.get(f.id).etape!=='F' ? `<p class="small muted">Comment ce séjour a été décidé : ${esc(libEtape(a))}.</p>` : ''}

/* ═══════════════ 2e TOUR ET DÉSISTEMENTS ═══════════════ */
function creneauxLibres(){
  const occ = occupation(), libres = []; let d = `${E.N}-01-01`, debut = null;
  while(d <= `${E.N+1}-01-02`){ const o = occ.has(d);
    if(!o && !debut) debut = d;
    if(o && debut){ libres.push([debut, d]); debut = null; }
    d = E.plus(d,1); }
  if(debut) libres.push([debut, `${E.N+1}-01-03`]);
  return libres.filter(([a,b]) => E.nuits(a,b) >= 2);
}
function vueTour2(){
  const C = calc();
  const libres = creneauxLibres();

  h += `<h3>Créneaux libres demandés par des foyers non servis</h3>`;
  h += avec.length ? avec.map(({g:[a,b], c, lib}) => {
    const voisins = C.attrib.filter(z => statutAtt(z)!=='annulé' && (z.d.fin===a || z.d.debut===b));
    return `<div class="gap ${lib?'lib':''}"><div class="h"><span class="d">${perC(a,b)}</span><span class="mini">${E.nuits(a,b)} nuits${E.periodeVac(a)?' · '+E.periodeVac(a):''}${lib?' · <span class="tag t-warn">libéré par désistement</span>':''}</span></div>
      ${lib && voisins.length ? `<p class="small" style="margin:6px 0">1. Prolongation possible : ${voisins.map(z => `${esc(nomF(C.F[z.d.fid]))} (${perC(z.d.debut,z.d.fin)})`).join(', ')}.</p>` : ''}
      ${c.map((o,i) => `<div class="cand"><span class="score ${scoreCls(o.f.score)}">${noteTxt(o.f.score)}</span><span class="q"><b>${i+1}. ${esc(nomF(o.f))}</b> · br. ${esc(o.f.br)}<div class="mini">souhaitait ${perC(o.x.demDebut,o.x.demFin)} (choix n°${o.x.choix}) · proposition ${perC(o.d,o.e)}, ${E.nuits(o.d,o.e)} nuits ${S.prix?'· '+prixHTML(E.tarif(o.d,o.e)):''}</div></span><button class="btn btn-teal btn-sm" data-act="t2-add" data-cf="${esc(o.f.cf)}" data-d="${o.d}" data-f="${o.e}">Proposer</button></div>`).join('') || '<p class="small muted">Aucun foyer non servi n\'avait demandé ces dates.</p>'}
    </div>`; }).join('') : '<p class="small muted">Aucun créneau libre ne correspond aux souhaits des foyers non servis.</p>';
  h += `<h3>Propositions du deuxième tour</h3>`;
  h += S.tour2.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Foyer</th><th>Début</th><th>Fin</th><th>Nuits</th>${S.prix?'<th class="r">Prix</th>':''}<th>Statut</th><th></th></tr></thead><tbody>${S.tour2.map((t,i) => { const f = C.foyers.find(z => z.cf===t.cf);
    return `<tr><td>${esc(f?nomF(f):t.cf)}</td><td><input type="date" value="${t.debut}" data-in="t2" data-i="${i}" data-k="debut"></td><td><input type="date" value="${t.fin}" data-in="t2" data-i="${i}" data-k="fin"></td><td class="num">${E.nuits(t.debut,t.fin)}</td>${S.prix?`<td class="r">${prixHTML(E.tarif(t.debut,t.fin))}</td>`:''}
      <td>${['proposé','accepté','décliné'].map(s => `<button class="chip ${t.statut===s?'on':''}" data-act="t2-statut" data-i="${i}" data-v="${s}">${s}</button>`).join(' ')}</td><td><button class="btn btn-line btn-sm" data-act="t2-del" data-i="${i}">Retirer</button></td></tr>`; }).join('')}</tbody></table></div>` : '<p class="small muted">Aucune proposition pour l\'instant.</p>';
  h += `<h3>Foyers non servis, par ordre de priorité</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>#</th><th>Foyer</th><th>Br.</th><th>Note</th><th>Souhaits</th><th>2e tour</th></tr></thead><tbody>${ns.map((f,i) => { const t = S.tour2.find(z => z.cf===f.cf);

  h += `<p class="mini" style="margin-top:8px">${pl(libres.length,'créneau libre','créneaux libres')} de 2 nuits ou plus dans l'année, au total ${libres.reduce((s,[a,b]) => s+E.nuits(a,b),0)} nuits.</p>`;
  return h;

function isoDe(v){
  if(v==null || v==='') return null;
  if(typeof v==='number'){ if(v<1000) return null; return E.ISO(Date.UTC(1899,11,30) + Math.floor(v+1e-9)*864e5); }
  if(v instanceof Date) return E.ISO(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()));
  const s = String(v).trim(); let m;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function lireClasseur(wb){
  const out = {};
  for(const sn of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null});
    for(let hI=0; hI<Math.min(6,rows.length); hI++){
      const H = (rows[hI]||[]).map(nrm);
      const col = (...c) => H.findIndex(x => c.some(k => x===k));
      const colP = (...c) => H.findIndex(x => c.some(k => x.startsWith(k)));
      const corps = rows.slice(hI+1).filter(r => r && r.some(v => v!=null && v!==''));
      if(!out.foyers && H.some(x => x.includes('choix n') && x.includes('debut'))){
        const ci = i => [H.findIndex(x => x.includes('choix n'+i) && x.includes('debut')), H.findIndex(x => x.includes('choix n'+i) && x.includes('fin'))];
        const iN = col('nom'), iP = col('prenom');
        out.foyers = corps.filter(r => r[iN]).map(r => ({corresp:r[col('correspondant')]||'', branche:String(r[col('branche')]||''), horodateur:isoDe(r[col('horodateur')])||String(r[col('horodateur')]||''),
          email:r[colP('adresse e-mail','adresse mail','email','e-mail')]||'', nom:String(r[iN]).trim(), prenom:String(r[iP]||'').trim(), option:r[colP('option',nrm(CONFIG.libelleOption))]||'',
          commentaire:r[colP('commentaire')]||'', choix:[1,2,3].map(i => { const [a,b] = ci(i); const d = a>=0?isoDe(r[a]):null, f = b>=0?isoDe(r[b]):null; return d&&f?[d,f]:null; })}));
        break;
      }
      const iAn = col('an','annee'), iA = colP('annuaire','ref annuaire'), iD = col('debut'), iNom = col('nom');
      if(!out.hist && iAn>=0 && iA>=0 && iD>=0 && iNom>=0){
        out.hist = corps.filter(r => r[iNom] && r[iAn]).map(r => [+r[iAn], isoDe(r[iD]), isoDe(r[col('fin')]), String(r[iNom]), String(r[col('prenom')] ?? 'nan'), String(r[iA]??'').trim().replace(/\.+$/,''), String(r[col('branche')]??'')]);
        break;
      }
      const iAR = col('annee refus');
      if(!out.refus && iNom>=0 && (iAR>=0 || (/refus/i.test(sn) && iAn>=0))){
        const ia = iAR>=0 ? iAR : iAn;
        out.refus = corps.filter(r => r[iNom] && r[ia]).map(r => [+r[ia], String(r[iNom]), String(r[col('prenom')] ?? 'nan'), String(r[colP('ref annuaire','annuaire')] ?? ''), r[col('source')]==='déduit'?'déduit':undefined].filter(v => v!==undefined));
        break;
      }
    }
  }
  return out;
}
function importer(file){
  const rd = new FileReader();
  rd.onload = e => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:false});
      const o = lireClasseur(wb);
      if(!o.foyers && !o.hist && !o.refus) throw new Error('aucun onglet reconnu (demandes du formulaire, historique ou refus)');
      // depuis la démonstration, on repart de zéro : rien de fictif ne se mélange aux vraies données
      const base = S.source.type==='int' ? {source:{demandes:'',historique:'',refus:''}, hist:[], refus:[], foyers:[]} : JSON.parse(JSON.stringify(donnees()));
      if(o.foyers) base.foyers = o.foyers; if(o.hist) base.hist = o.hist;
      if(o.refus){ const ans = new Set(o.refus.map(r => r[0])); base.refus = base.refus.filter(r => !ans.has(r[0])).concat(o.refus); o.refusGardes = base.refus.length - o.refus.length; }
      S.data = base; S.source = {type:'fic', nom:file.name, date:new Date().toLocaleDateString('fr-FR'), stamp:'f'+Date.now()};
      S.ui.ouvert = null; S.ui.fiche = null;
      sauver(); render();
      toast(`Importé : ${[o.foyers&&pl(o.foyers.length,'foyer demandeur','foyers demandeurs'), o.hist&&pl(o.hist.length,'séjour')+' d\'historique', o.refus&&pl(o.refus.length,'refus','refus')+(o.refusGardes?` (${o.refusGardes} refus d'autres années conservés)`:'')].filter(Boolean).join(', ')}.`);
    }catch(err){ toast('Import impossible : '+err.message); }
  };
  rd.readAsArrayBuffer(file);
}

document.addEventListener('click', e => {

    case 'alias-del': majOvr(b.dataset.cf, o => { o.alias = (o.alias||[]).filter((_,i) => i!==+b.dataset.i); }); break;
    case 'forcer': { const k = b.dataset.k, cible = val('force-'+k), r = val('force-r-'+k).trim();
      if(!cible) return; S.p.forces = S.p.forces.filter(z => z!==cible).concat(cible); if(r) S.raisons['force:'+cible] = r; S.ui.attOuvert = cible; toast('Décision enregistrée : la répartition est recalculée autour de ce choix.'); break; }
    case 'ajuster': { const k = b.dataset.k, d = val('aj-d-'+k), f = val('aj-f-'+k), n = val('aj-n-'+k).trim();
      if(!d||!f||f<=d){ toast('Dates invalides.'); return; } S.p.ajust[k] = {debut:d, fin:f, note:n||'dates modifiées'}; toast('Dates modifiées, sous réserve d\'accord du foyer.'); break; }
    case 'exclure': { const k = b.dataset.k, r = val('ex-r-'+k).trim(); S.p.exclus[k] = 'écartée par le comité' + (r?' : '+r:''); S.p.forces = S.p.forces.filter(z => z!==k); S.ui.attOuvert = null; break; }
    case 'annuler-dec': { const t = b.dataset.type, k = b.dataset.k;
      if(t==='force'){ S.p.forces = S.p.forces.filter(z => z!==k); delete S.raisons['force:'+k]; }
      if(t==='ajust'){ delete S.p.ajust[k]; delete S.raisons['ajust:'+k]; }
      if(t==='exclus') delete S.p.exclus[k];
      if(t==='ovr'){ delete S.ovr[k]; delete S.raisons['ovr:'+k]; }
      break; }
    case 'statut': S.statuts[b.dataset.k] = v; if(v==='attribué') delete S.statuts[b.dataset.k]; break;
    case 'crfiltre': S.ui.crFiltre = v; S.ui.fiche = null; break;
    case 'fiche': S.ui.fiche = v; break;
    case 'copier': { const t = document.getElementById('lettre'); t.select(); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast('Courrier copié.')).catch(() => { document.execCommand('copy'); toast('Courrier copié.'); }); return; }
    case 'imprimer': window.print(); return;
    case 'modeles-def': S.modeles = {...MODELES_DEF}; break;
    case 'brevo': exportBrevo(); return;
    case 't2-add': S.tour2.push({cf:b.dataset.cf, debut:b.dataset.d, fin:b.dataset.f, statut:'proposé'}); break;
    case 't2-statut': S.tour2[+b.dataset.i].statut = v; break;
    case 't2-del': S.tour2.splice(+b.dataset.i, 1); break;
    case 'importer': document.getElementById('file-input').click(); return;
    case 'exporter': exporter(false); return;
    case 'cloturer': exporter(true); return;
    case 'reset': if(!confirm('Revenir aux données de démonstration ? Les modifications faites dans ce navigateur seront perdues.')) return;
      S = etatInitial(); BASE_KEY = null; CALC_KEY = null; appliquerDecisionsInitiales(); toast('Application réinitialisée.'); break;
    default: return;
  }
  sauver(); render();
  if(act==='aller' && S.ui.attOuvert){ const el = document.getElementById('att-'+S.ui.attOuvert); if(el) el.scrollIntoView({block:'center'}); }
});
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset.in; if(!k) return;
  if(k==='q'){ S.ui.q = t.value; document.getElementById('liste-dem').innerHTML = tableDemandes(); sauver(); return; }
  if(k==='crQ'){ S.ui.crQ = t.value; sauver(); const pos = t.selectionStart; renderVue(); const n = document.querySelector('[data-in=crQ]'); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(k==='modele'){ S.modeles[t.dataset.k] = t.value; sauver(); const l = document.getElementById('lettre'); const C = calc(); const f = C.foyers.find(z => z.cf===S.ui.fiche); if(l && f) l.value = lettre(f); return; }
  if(k==='raison-ovr'){ S.raisons['ovr:'+t.dataset.cf] = t.value; sauver(); return; }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.in;
  if(t.id==='file-input'){ if(t.files[0]) importer(t.files[0]); t.value = ''; return; }
  if(!k) return;
  if(k==='br'){ S.ui.br = t.value; S.ui.ouvert = null; }
  else if(k==='noelMin') S.p.noelMin = Math.max(0, Math.min(10, +t.value||0));
  else if(k==='modeA') S.p.modeA = t.value;
  else if(k==='noteMode') S.p.noteMode = t.value;
  else if(k==='dateReponse') S.dates.reponse = t.value || S.dates.reponse;
  else if(k==='t2'){ const x = S.tour2[+t.dataset.i]; if(t.value) x[t.dataset.k] = t.value; if(x.fin<=x.debut) x.fin = E.plus(x.debut, 2); }
  else return;
  sauver(); render();
});

/* ═══════════════ INIT ═══════════════ */
document.title = `Attribution des séjours ${E.N} · ${CONFIG.association}`;
document.getElementById('h-eyebrow').textContent = CONFIG.association;
document.getElementById('h-titre').textContent = `Attribution des séjours ${E.N}`;
document.getElementById('h-sub').textContent = `Note de priorité · trois tours · décisions du comité · prix ${E.N}`;
charger();
appliquerDecisionsInitiales();
sauver();
render();

</script>
